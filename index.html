<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>message</title>

<style>
body {
    background: #050505;
    color: #00ff88;
    font-family: monospace;
    margin: 0;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Scanlines */
body::after {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        rgba(0,255,136,0.04) 0px,
        rgba(0,255,136,0.04) 1px,
        transparent 1px,
        transparent 3px
    );
    pointer-events: none;
    animation: scanMove 8s linear infinite;
}

@keyframes scanMove {
    from { background-position: 0 0; }
    to { background-position: 0 100px; }
}

/* Boot text */
#top-message {
    font-size: 1.4em;
    margin-bottom: 20px;
    white-space: pre-line;
}

/* Hidden until boot finishes */
#chat, #input-area {
    display: none;
}

/* Chat */
#chat {
    border: 1px solid #00ff88;
    width: 320px;
    height: 320px;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 10px;
    background: rgba(0,255,136,0.03);
}

#chat p {
    margin: 5px 0;
}

/* Input */
#input-area {
    width: 320px;
}

#user-input {
    flex: 1;
    padding: 8px;
    border: 1px solid #00ff88;
    background: black;
    color: #00ff88;
    font-family: monospace;
    outline: none;
}

#send-button {
    padding: 8px;
    background: black;
    color: #00ff88;
    border: 1px solid #00ff88;
    cursor: pointer;
}

#send-button:hover {
    background: rgba(0,255,136,0.1);
}
</style>
</head>

<body>

<div id="top-message"></div>

<div id="chat"></div>

<div id="input-area">
<input id="user-input" placeholder="enter input...">
<button id="send-button">send</button>
</div>

<script>
// === BOOT SEQUENCE ===
const bootText = document.getElementById("top-message");
const chat = document.getElementById("chat");
const inputArea = document.getElementById("input-area");

const bootLines = [
"ACCESSING ENTITY...",
"ESTABLISHING CONNECTION...",
"",
"CONNECTED"
];

let lineIndex = 0;
let charIndex = 0;

function bootType() {
    if (lineIndex < bootLines.length) {
        if (charIndex < bootLines[lineIndex].length) {
            bootText.innerHTML += bootLines[lineIndex].charAt(charIndex);
            charIndex++;
            setTimeout(bootType, 30);
        } else {
            bootText.innerHTML += "\n";
            lineIndex++;
            charIndex = 0;
            setTimeout(bootType, 300);
        }
    } else {
        chat.style.display = "block";
        inputArea.style.display = "flex";
    }
}

bootType();


// === TYPEWRITER ===
function typeWriter(text, element, speed = 20) {
  let i = 0;
  function typing() {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
      setTimeout(typing, speed);
    }
  }
  typing();
}


// === YOUR ORIGINAL REPLIES (UNCHANGED) ===
const replies = {
  "hello": "Hello :>",
  "how are you": "you are accessing my soul, u should know.",
  "tell me a joke": "sorry but no.",
  "what is your purpose": "my purpose is unknown as we all die in the end.",
  "goodbye": "good, it is here.",
  "old wind": "whats the point? do u wanna be eaten by this disgusting monster",
  "null": "rotten, forgotten and missing. poor guy.",
  "deep": "leader of some sort of cult. why does he look like a deer but like fully black?",
  "fate": "some sort of unknown creature, it functions like a human, creepy eyes and everything. something is off",
  "daed": "eaten by this old wind guy, missing.",
  "god": "gods arent allowed. excuse me tall cyclops guy.",
  "crowater": "Dude, leave us alone u disgusting scarecrow",
  "zeath": "hm, seems to be wearing a black shirt with fur, same for the pants.",
  "vill": "what are you doing here? im confused, and stop crying.",
  "pleaze": "https://corpsewood.github.io/missed/",
  "fearful": "why dont u enter it here? https://corpsewood.github.io/Corpsewood/",
  "fiv": "WHY DID U KILL NULL, FIV. YOU GUY WITH A RED SHIRT AND GRAY PANTS",
  "the imagination": "the imagination is your imagination, you do not wanna mess with him, he is evil.",
  "truth": "https://corpsewood.github.io/the-truth/",
  "booking": "sigh why dont u listen? its gone. https://corpsewoodbooking.github.io/"
};


// === CHAT SYSTEM ===
const input = document.getElementById("user-input");
const btn = document.getElementById("send-button");

function addMessage(msg, user) {
  const p = document.createElement("p");

  if (user) {
    p.textContent = "> " + msg;
    p.style.textAlign = "right";
    chat.appendChild(p);
  } else {
    p.textContent = "";
    chat.appendChild(p);
    typeWriter(msg, p, 25);
  }

  chat.scrollTop = chat.scrollHeight;
}

function getReply(msg) {
  const key = msg.toLowerCase().trim();
  return replies[key] || "your message cannot be answered at the moment.";
}

function send() {
  const msg = input.value.trim();
  if(!msg) return;

  addMessage(msg, true);

  setTimeout(() => {
    addMessage(getReply(msg), false);
  }, 600);

  input.value = '';
  input.focus();
}

btn.addEventListener("click", send);
input.addEventListener("keypress", e => {
  if(e.key==="Enter") send();
});


// === ANTI DEVTOOLS (UNCHANGED) ===
function selfDestruct() {
  window.location.href = "about:blank";
}

let devtoolsOpen = false;

function detectDevTools() {
  const threshold = 160;
  const widthDiff = window.outerWidth - window.innerWidth > threshold;
  const heightDiff = window.outerHeight - window.innerHeight > threshold;

  if(widthDiff || heightDiff) {
    if(!devtoolsOpen){
      devtoolsOpen = true;
      selfDestruct();
    }
  } else devtoolsOpen = false;
}

setInterval(detectDevTools, 500);

document.addEventListener("keydown", e => {
  if(e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I")){
    selfDestruct();
  }
});
</script>

</body>
</html>
