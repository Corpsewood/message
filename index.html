<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Message System</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}
#chat{border:2px solid #fff;width:300px;height:300px;overflow-y:auto;padding:10px;margin-bottom:10px}
#input-area{display:flex}
#user-input{flex:1;padding:8px;border:2px solid white}
#send-button{padding:8px;background:white;color:black;border:none;cursor:pointer}
</style>
</head>
<body>

<div style="color:red;font-size:1.5em;margin-bottom:20px">You're accessing my soul...</div>
<div id="chat"></div>

<div id="input-area">
<input id="user-input" placeholder="Type something...">
<button id="send-button">Send</button>
</div>

<script>

const chat=document.getElementById("chat")
const input=document.getElementById("user-input")
const btn=document.getElementById("send-button")

function add(msg,user){
const p=document.createElement("p")
p.textContent=msg
if(user)p.style.textAlign="right"
chat.appendChild(p)
chat.scrollTop=chat.scrollHeight
}

/* encrypted data blob (not readable) */
const blob="W3siaSI6ImhlbGxvIiwiciI6IkhlbGxvIDo+In0seyJpIjoiaG93IGFyZSB5b3UiLCJyIjoieW91IGFyZSBhY2Nlc3NpbmcgbXkgc291bCwgdSBzaG91bGQga25vdy4ifV0="

/* decode at runtime */
function decode(){
return JSON.parse(atob(blob))
}

function getReply(text){
const data=decode()
const key=text.toLowerCase().trim()

for(let i=0;i<data.length;i++){
if(data[i].i===key){
return data[i].r
}
}

return "your message cannot be answered at the moment."
}

function send(){
const msg=input.value.trim()
if(!msg)return

add(msg,true)

setTimeout(()=>{
add(getReply(msg),false)
},500)

input.value=""
input.focus()
}

btn.onclick=send
input.addEventListener("keypress",e=>{
if(e.key==="Enter")send()
})

</script>

</body>
</html>
