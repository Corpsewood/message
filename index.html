// Decode blob at runtime
function decode(){ return JSON.parse(atob(blob)) }

function getReply(text){
  const data = decode()
  const key = text.toLowerCase().trim()
  for(let i=0;i<data.length;i++){
    if(data[i].i===key) return data[i].r
  }
  return "your message cannot be answered at the moment."
}

function send(){
  const msg = input.value.trim()
  if(!msg) return

  add(msg,true)

  setTimeout(()=>{
    add(getReply(msg),false)
  },500)

  input.value=""
  input.focus()
}

btn.onclick = send
input.addEventListener("keypress",e=>{
  if(e.key==="Enter") send()
})
