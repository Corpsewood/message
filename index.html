function decode(){ return JSON.parse(atob(blob)); }

function getReply(text){
  var data = decode();
  var key = text.toLowerCase().trim();
  for(var i=0;i<data.length;i++){
    if(data[i].i===key) return data[i].r;
  }
  return "your message cannot be answered at the moment.";
}

function send(){
  var msg = input.value.trim();
  if(!msg) return;
  add(msg,true);
  setTimeout(function(){ add(getReply(msg),false); },500);
  input.value="";
  input.focus();
}

btn.onclick = send;
input.addEventListener("keypress", function(e){ if(e.key==="Enter") send(); });
